{% extends 'base.html' %}{% block content %}<div class="narrow"><p class="eyebrow">DALE UNA NUEVA OPORTUNIDAD</p><h1 class="page-title">¿Qué querés vender?</h1><form class="panel stack" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Título<input name="titulo" placeholder="Ej.: Taladro percutor con maletín" minlength="4" maxlength="100" required value="{{ request.form.get('titulo','') }}"></label><div class="form-row"><label>Precio en pesos<input name="precio" type="number" step="0.01" min="0.01" max="999999999" required value="{{ request.form.get('precio','') }}"></label><label>Categoría<select name="categoria" required>{% for cat in categories %}<option {% if request.form.get('categoria')==cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label></div><label>Descripción<textarea name="descripcion" rows="5" minlength="10" maxlength="3000" required placeholder="Contá el estado, las medidas y los detalles que ayuden a elegir.">{{ request.form.get('descripcion','') }}</textarea></label><label>Fotos del producto<input type="file" name="fotos" accept="image/jpeg,image/png,image/webp" multiple required></label><p class="hint">De 1 a 4 fotos. Hasta 6 MB y 24 megapíxeles cada una. Si hay un error, volvé a seleccionarlas.</p><label>Localidad<input name="zona" placeholder="González Catán, Buenos Aires" maxlength="80" required value="{{ request.form.get('zona','') }}"></label><label>WhatsApp con código internacional<input name="whatsapp" inputmode="numeric" pattern="[1-9][0-9]{7,14}" placeholder="54911…" required value="{{ request.form.get('whatsapp','') }}"></label><label class="check"><input name="public_contact" type="checkbox" value="yes" required> Acepto mostrar este WhatsApp en mi publicación para recibir consultas.</label><button>Publicar producto</button></form></div>{% endblock %}
